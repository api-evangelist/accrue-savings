  name: Accrue Merchant API
  description: The Accrue Merchant API is a JSON:API-based REST API for embedding Accrue's stored-value
    wallet into a merchant experience — creating and funding wallets, running payment intents and payments
    (authorize, capture, cancel, complete, refund, increase authorization), onboarding users through KYC
    and identity verification, managing counterparties and payouts, issuing rewards and gifts, and subscribing
    to twenty webhook topics. Published as OpenAPI 3.1 with 82 operations across production and sandbox
    environments.
