- aid: accrue-savings:accrue-savings-paymentintents-api
  name: Accrue Savings Payment Intents API
  description: >-
    Payment Intents represent a commitment to pay a specified amount, allowing for a structured process
    to handle payments from initiation to completion. This resource serves as a provisional step in the
    payment process, where the amount, payment method, and other details are specified by the initiator
    (e.g., a user, support staff, or merchant). Payment Intents can go through several states, such as
    requiring action, being canceled, or being promoted to an actual payment upon successful authorization.
  humanURL: https://docs.byaccrue.com/api/
  baseURL: https://merchant-api.accruesavings.com
  tags:
  - PaymentIntents
  properties:
