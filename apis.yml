- aid: accrue-savings:accrue-savings-rewards-api
  name: Accrue Savings Rewards API
  description: >-
    Partner-issued rewards let trusted integrations credit customer wallets or create pre-issued rewards
    for recipients identified by phone number. When a recipient has an active wallet, rewards are deposited
    immediately. When no active wallet exists, a pre-issued reward is created for the user to claim when
    they sign up. All issue requests require an idempotency key.
  humanURL: https://docs.byaccrue.com/api/
  baseURL: https://merchant-api.accruesavings.com
