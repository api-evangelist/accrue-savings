- aid: accrue-savings:accrue-savings-payments-api
  name: Accrue Savings Payments API
  description: >-
    Payments are the realization of payment intents, representing the actual transfer or authorization
    of funds. This resource encapsulates the details of completed transactions, including the payment
    status, amount, and any adjustments or refunds that have occurred post-initial authorization. Payments
    can have various statuses reflecting their current state, from pending to refunded, providing a comprehensive
    view of the transaction lifecycle.
  humanURL: https://docs.byaccrue.com/api/
  baseURL: https://merchant-api.accruesavings.com
