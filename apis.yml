aid: accrue-savings
name: Accrue Savings
description: Accrue Savings (legally Accrue Money, Inc., now trading as Accrue at byaccrue.com) is a New
  York fintech that powers customer loyalty at the payment layer with a branded stored-value wallet merchants
  embed in their own checkout. Its platform lets brands hold customer funds in a wallet, accept payments
  over wallet and bank rails, run a rules-driven reward engine, return refunds as closed-loop credit,
  and let shoppers pre-fund or crowdfund a future purchase. The Accrue Merchant API is a public, JSON:API-shaped
  OpenAPI 3.1 contract covering wallets, payment intents, payments, users, KYC and identity verification,
  counterparties and payouts, linked accounts, rewards, gifts, sweepstakes, external transactions and
  webhooks, with a sandbox environment, mobile SDKs for iOS/Android/React Native/Expo, and embeddable
  web wallet widgets. Banking services are provided by Cross River Bank, Member FDIC.
