identifier_conventions:
  format: UUID v4 for nearly every resource id
  exceptions:
  - lookUpId (gift / wallet barcode scan string)
  - userReference and userIdentifier (merchant-supplied alternates to userId)
  note: 'The contract warns explicitly: "Never send a gift `data.id` as `walletId`" — the two id spaces
    are distinct despite both being accepted by createPaymentIntent.'
money:
  unit: smallest currency unit (cents for USD)
  type: integer
  note: Divide by 100 for dollars. Counterparty balances were widened to 64-bit on 2026-08-26.
