note: 'No ISO 20022, FDX, or Open Banking message shape appears anywhere in the contract — Accrue moves
  money through Cross River Bank over ACH/wire rails and exposes its own resource model rather than a
  banking-standard message set, so no financial-messaging domain standard is asserted. REWARD-ONLY: the
  absence is recorded, not penalised.'
