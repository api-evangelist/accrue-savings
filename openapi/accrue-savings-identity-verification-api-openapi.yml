  /api/v1/users/:userIdentifier/identity-verification/challenges/:challengeId/submissions:
    post:
      operationId: submitIdentityVerificationChallenge
      tags:
      - Identity Verification
      summary: Submit Identity Verification Challenge
      description: Submits answers for an active challenge. Each challenge allows up to three submission attempts. When all answers are correct, the response includes a single-use `verificationToken` that can be used to apply a verified profile update within 10 minutes.
      parameters:
      - schema:
          type: string
          description: Accrue `userId` or merchant `userReference` (`externalUserId` / `stableExternalUserId`). Accrue resolves the identifier automatically against active wallets for your merchant.
          example: merchant-user-42
        required: true
        name: userIdentifier
        in: path
      - schema:
          type: string
          format: uuid
          description: The challenge ID returned from the create challenge endpoint.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: challengeId
        in: path
      - schema:
          type: string
          format: uuid
          description: The unique identifier of the client making the request. This header is required to retrieve the client-specific configuration and ensure that the response is tailored to the client's settings and permissions.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/SubmitIdentityVerificationChallengeRequest'
      responses:
        '200':
          description: Submission processed. Check `passed` to determine whether a verification token was issued.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SubmitIdentityVerificationChallengeResponse'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SubmitIdentityVerificationChallengeErrorResponse'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ChallengeNotFoundResponse'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UnexpectedIdentityVerificationErrorResponse'
