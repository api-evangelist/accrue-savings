components:
  schemas:
    CreateIdentityVerificationChallengeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/IdentityVerificationChallenge'
      required:
      - data
    ApplyVerifiedProfileUpdateNotFoundResponse:
      anyOf:
      - $ref: '#/components/schemas/UserNotFoundForIdentityVerificationResponse'
      - $ref: '#/components/schemas/ChallengeNotFoundResponse'
    ApplyVerifiedProfileUpdateRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - ProfileUpdate
            attributes:
              type: object
              properties:
                verificationToken:
                  type: string
                  description: Single-use token from a successful challenge submission.
                  example: pvt_a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456
                phoneNumber:
                  type: string
                  description: New phone number in E.164 format (for example, `+12125551234`).
                  example: '+12125551234'
                email:
                  type: string
                  format: email
                  description: New email address.
                  example: user@example.com
              required:
              - verificationToken
          required:
          - type
          - attributes
      required:
      - data
    MaxAttemptsExceededResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 400
        code:
          type: string
          enum:
          - MaxAttemptsExceeded
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: MaxAttemptsExceeded
        title:
          type: string
          description: Generic title for the error.
          example: Max Attempts Exceeded
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - The maximum number of verification attempts has been exceeded.
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
