  /api/v1/users/:userIdentifier/identity-verification/profile-updates:
    post:
      operationId: applyVerifiedProfileUpdate
      tags:
      - Identity Verification
      summary: Apply Verified Profile Update
      description: Applies a phone number and/or email update after the user passes identity verification. Requires a valid, unused `verificationToken` from a successful challenge submission. At least one of `phoneNumber` or `email` must be provided. Changing the phone number clears the user's Better Auth session link and marks the updated contact fields as unverified.
      parameters:
      - schema:
          type: string
          description: Accrue `userId` or merchant `userReference` (`externalUserId` / `stableExternalUserId`). Accrue resolves the identifier automatically against active wallets for your merchant.
          example: merchant-user-42
        required: true
        name: userIdentifier
        in: path
      - schema:
          type: string
          format: uuid
          description: The unique identifier of the client making the request. This header is required to retrieve the client-specific configuration and ensure that the response is tailored to the client's settings and permissions.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ApplyVerifiedProfileUpdateRequest'
      responses:
        '200':
          description: Profile update applied successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApplyVerifiedProfileUpdateResponse'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApplyVerifiedProfileUpdateErrorResponse'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApplyVerifiedProfileUpdateNotFoundResponse'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UnexpectedIdentityVerificationErrorResponse'
