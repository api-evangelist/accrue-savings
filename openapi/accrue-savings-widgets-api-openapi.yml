  /api/v2/widgets/wallet/{walletId}:
    get:
      operationId: getWalletWidgetDataV2
      tags:
      - Widgets
      summary: Get Wallet Widget Data (V2)
      description: 'This endpoint returns data: null instead of 400 error when no wallet is found'
      parameters:
      - schema:
          type: string
