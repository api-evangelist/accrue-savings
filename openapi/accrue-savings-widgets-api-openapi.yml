components:
  schemas:
    WidgetSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the object.
          readOnly: true
        type:
          type: string
          enum:
          - WidgetSession
        attributes:
          type: object
          properties:
            sessionToken:
              type: string
              description: The session token used to authenticate widget requests
              example: wgt_session_1234567890abcdef
            createdAt:
              type: string
              format: date-time
              description: The timestamp when the session was created
              example: '2025-01-15T10:30:00.000Z'
          required:
          - sessionToken
          - createdAt
      required:
      - id
      - type
      - attributes
      description: Widget Session
      x-tags:
      - Model
    NoWalletFoundResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 400
        code:
          type: string
          enum:
          - NoWalletFound
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: NoWalletFound
        title:
          type: string
          description: Generic title for the error.
          example: WidgetException
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - WidgetException (code='NoWalletFound' message='No wallet found for defined filters.' metaData=undefined)
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/widgets/wallet/123e4567-e89b-12d3-a456-426614174000
          required:
          - environment
          - timestamp
          - path
          example:
            environment: sandbox
            timestamp: '2025-06-23T12:00:00.000Z'
            path: /api/v1/widgets/wallet/123e4567-e89b-12d3-a456-426614174000
