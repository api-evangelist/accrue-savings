    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the object.
          readOnly: true
        type:
          type: string
          enum:
          - Payment
        attributes:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
            status:
              type: string
              enum:
              - Canceled
              - Created
              - Failed
              - Processing
              - Returned
              - Sent
              description: The current status of the payment. Each status indicates a specific phase in the payment process, such as waiting for authorization, being processed, or having been successfully completed or canceled.
              example: Sent
            amount:
              type: integer
              description: The total amount of the payment processed, represented in the smallest currency unit (e.g., cents for USD). To obtain the value in dollars, divide by 100. This amount may differ from the initially intended amount due to adjustments, fees, or additional charges.
              format: int32
              example: 9999
            channel:
              type:
              - string
              - 'null'
              description: External system identifier used to identify the payment channel. E.g. App Name, Activity ID, Checkout Interface, etc.
              example: ORG-1
            reference:
              type:
              - string
              - 'null'
              description: Reference to the data inside an external system.
              example: MERCHANT-GENERATED-TOKEN
            disbursement:
              type: array
              items:
                type: object
                properties:
                  counterpartyId:
                    type: string
                    format: uuid
                    description: The ID of the counterparty to whom the funds are being disbursed.
                    example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                  amount:
                    type: integer
                    description: The total amount charged with a particular payment method, represented in the smallest currency unit (e.g., cents for USD). To obtain the value in dollars, divide by 100.
                    format: int32
                    example: 1337
                  fee:
                    type: integer
                    description: The fee assigned to this particular disbursement based on the whole payment fee, represented in the smallest currency unit (e.g., cents for USD). To obtain the value in dollars, divide by 100.
                    format: int32
                    deprecated: true
                    example: 10
                  remit:
                    type: boolean
                    description: Deprecated. Always returns `true`. All disbursements are remitted directly. Will be removed in a future version.
                    example: true
                    deprecated: true
                required:
                - counterpartyId
                - amount
                - fee
                - remit
              description: Array of disbursements associated with this payment, including counterparty IDs, amounts, and fees.
              example:
              - counterpartyId: 9f755746-13cb-4d0b-81f2-3b4f1b44f6d8
                amount: 800
                fee: 10
                remit: true
              - counterpartyId: 4cf95060-dd01-42ac-9020-8ca42004920d
                amount: 200
                fee: 5
                remit: true
            charges:
              type: object
              properties:
                fee:
                  type: object
                  properties:
                    amount:
                      type: integer
                      minimum: 0
                      description: Fee amount in cents
                      format: int32
                      example: 150
                    type:
                      type: string
                      description: Fee type identifier
                      example: pay_by_wallet
                  required:
                  - amount
                  - type
                  description: Processing fee details
                rewards:
                  type: integer
                  minimum: 0
                  description: Rewards amount spent from wallet balance, in cents
                  format: int32
                  example: 1000
              description: Charges applied to this payment.
            deductions:
              type: object
              properties:
                rewards:
                  type: integer
                  minimum: 0
                  description: Rewards amount spent from wallet balance, in cents
                  format: int32
                  example: 1000
                fees:
                  type: integer
                  minimum: 0
                  description: Processing fees charged, in cents
                  format: int32
                  example: 150
              required:
              - rewards
              - fees
              description: Legacy charges breakdown. Use `charges` instead.
              deprecated: true
            expiresAt:
              type: string
              format: date-time
              description: The field indicates the date and time until which the payment is valid. After this date, the payment will either be automatically cancelled or completed.
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
          required:
          - updatedAt
          - createdAt
        relationships:
          type: object
          properties:
            paymentIntent:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
