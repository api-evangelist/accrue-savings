  /api/v1/simulation/counterparties/{counterpartyId}/deposits:
    post:
      operationId: simulateCounterpartyDeposit
      summary: Simulate Counterparty Deposit
      description: 'Simulate an incoming bank deposit into a counterparty''s Accrue deposit account.


        Use this to credit a counterparty in development, sandbox, and local environments without sending a real ACH or wire.


        The request is accepted immediately. The counterparty balance updates asynchronously after the incoming payment is processed, so a subsequent read may briefly show the previous balance.


        The counterparty must already have an Accrue deposit account (`internalBankAccount` on the counterparty resource). Counterparties without one cannot receive simulated deposits.


        **This endpoint is only available in development, sandbox, and local testing environments.**'
      tags:
      - Simulations
      parameters:
      - schema:
          type: string
          format: uuid
          description: Counterparty ID
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: counterpartyId
        in: path
      - schema:
          type: string
          format: uuid
          description: The unique identifier of the client making the request. This header is required to retrieve the client-specific configuration and ensure that the response is tailored to the client's settings and permissions.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/SimulateCounterpartyDeposit'
              required:
              - data
      responses:
        '204':
          description: No Content - Deposit simulation accepted
        '400':
          description: Invalid amount, or counterparty does not have an Accrue deposit account
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CounterpartyDepositSimulationValidationResponse'
        '404':
          description: Counterparty not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CounterpartyNotFoundForSimulationResponse'
