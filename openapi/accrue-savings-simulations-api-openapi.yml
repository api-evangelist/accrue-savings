        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                testCardType:
                  type: string
                  enum:
                  - visa-us-credit
                  - visa-gb-credit
                  - visa-gb-debit
                  - mastercard-mu-credit
                  - mastercard-de-debit
                  description: Test card type from Checkout.com that returns response code 10000 (successful transaction)
                  example: visa-us-credit
      responses:
        '200':
          description: Successfully created demo backup payment method
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateDemoBackupPaymentMethodResponse'
        '201':
          description: Successfully created demo backup payment method
