components:
  schemas:
    WalletBarcode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the object.
          readOnly: true
        type:
          type: string
          enum:
          - WalletBarcode
        attributes:
          type: object
          properties:
            lookUpId:
              type: string
              description: Lookup identifier for the barcode. Used when creating payment intents or fetching the barcode.
              example: SCAN-LOOKUP-ID
            expiresAt:
              type:
              - string
              - 'null'
              format: date-time
              description: When the barcode expires. Null if no expiry.
              example: '2025-12-31T23:59:59.000Z'
            usageLimit:
              type:
              - integer
              - 'null'
              description: Maximum number of times the barcode can be used. Null if unlimited.
              format: int32
            usageCount:
              type: integer
              description: Number of times the barcode has been used. Present in list/generate responses.
              format: int32
            referenceId:
              type:
              - string
              - 'null'
              description: External reference ID. Present when fetching barcode by lookUpId.
              example: customer-reference-id
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
          required:
          - lookUpId
          - expiresAt
          - createdAt
          - updatedAt
      required:
      - id
      - type
      - attributes
      description: WalletBarcode
      x-tags:
      - Model
    CounterpartyNotFoundForSimulationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 404
        code:
          type: string
          enum:
          - NotFound
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: NotFound
        title:
          type: string
          description: Generic title for the error.
          example: ErrorResponseDto
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - Counterparty not found
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/simulation/counterparties/123e4567-e89b-12d3-a456-426614174000/deposits
          required:
          - environment
          - timestamp
          - path
          example:
            environment: sandbox
            timestamp: '2025-06-23T12:00:00.000Z'
            path: /api/v1/simulation/counterparties/123e4567-e89b-12d3-a456-426614174000/deposits
      required:
      - id
      - status
      - code
      - title
      - detail
      - meta
    CreateDemoBackupPaymentMethodResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DemoBackupPaymentMethod'
      required:
      - data
    SimulateCounterpartyDeposit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the object.
          readOnly: true
        type:
          type: string
          enum:
          - SimulateCounterpartyDeposit
        attributes:
          type: object
          properties:
            amount:
              type: integer
              minimum: 1
              description: Amount to deposit in cents
              format: int32
              example: 10000
          required:
          - amount
      required:
      - id
      - type
      - attributes
      description: SimulateCounterpartyDeposit
      x-tags:
      - Model
    CounterpartyDepositSimulationValidationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 400
        code:
          type: string
          enum:
          - InvalidAmount
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: InvalidAmount
        title:
          type: string
          description: Generic title for the error.
          example: ErrorResponseDto
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - Amount must be a positive integer.
          - Counterparty does not have an Accrue deposit account to receive external deposits.
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/simulation/counterparties/123e4567-e89b-12d3-a456-426614174000/deposits
          required:
          - environment
          - timestamp
          - path
