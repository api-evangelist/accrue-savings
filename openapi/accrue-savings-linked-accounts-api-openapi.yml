components:
  schemas:
    UnexpectedLinkedAccountErrorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 500
        code:
          type: string
          enum:
          - UnexpectedError
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: UnexpectedError
        title:
          type: string
          description: Generic title for the error.
          example: LinkedAccountException
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - An unexpected error occurred.
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/users/123e4567-e89b-12d3-a456-426614174000/linked-accounts
          required:
          - environment
          - timestamp
          - path
          example:
            environment: sandbox
            timestamp: '2025-06-23T12:00:00.000Z'
            path: /api/v1/users/123e4567-e89b-12d3-a456-426614174000/linked-accounts
      required:
      - id
      - status
      - code
      - title
      - detail
      - meta
    LinkedAccountInvalidUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 400
        code:
          type: string
          enum:
          - InvalidUser
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: InvalidUser
        title:
          type: string
          description: Generic title for the error.
          example: LinkedAccountException
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - User '{userId}' does not have a wallet with this merchant.
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/users/123e4567-e89b-12d3-a456-426614174000/linked-accounts
          required:
          - environment
          - timestamp
          - path
          example:
            environment: sandbox
            timestamp: '2025-06-23T12:00:00.000Z'
            path: /api/v1/users/123e4567-e89b-12d3-a456-426614174000/linked-accounts
      required:
      - id
      - status
      - code
      - title
      - detail
      - meta
    GetLinkedAccountsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Unique identifier for the object.
                readOnly: true
              type:
                type: string
                enum:
                - LinkedAccount
              attributes:
                type: object
                properties:
                  provider:
                    type: string
                    enum:
                    - Meld
                    - Plaid
                    - Checkout
                    description: The provider used to link the bank account.
                  status:
                    type: string
                    enum:
                    - Connected
                    - Disconnected
                    - Pending
                    description: The current status of the linked account.
                  accountType:
                    type: string
                    enum:
                    - checking
                    - savings
                    - debit
                    - creditCard
                    - fundingCreditCard
                    - pending
                    description: The type of the linked account.
                  accountName:
                    type: string
                    description: The name of the account as provided by the institution.
                    example: Plaid Checking
                  accountMask:
                    type: string
                    description: The masked account number (typically last 4 digits).
                    example: '0000'
                  institutionName:
                    type: string
                    description: The name of the financial institution.
                    example: Plaid Bank
                  institutionId:
                    type: string
                    description: The unique identifier for the institution.
                    example: ins_109508
                  updatedAt:
                    type: string
                    format: date-time
                    readOnly: true
                  createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                required:
                - updatedAt
                - createdAt
            required:
            - id
            - type
            - attributes
      required:
      - data
    LinkedAccountUserNotFoundResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 404
        code:
          type: string
          enum:
          - LinkedAccountNotFound
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: LinkedAccountNotFound
        title:
          type: string
          description: Generic title for the error.
          example: LinkedAccountNotFoundException
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - User '{userId}' not found.
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/users/123e4567-e89b-12d3-a456-426614174000/linked-accounts
          required:
          - environment
          - timestamp
          - path
          example:
            environment: sandbox
            timestamp: '2025-06-23T12:00:00.000Z'
            path: /api/v1/users/123e4567-e89b-12d3-a456-426614174000/linked-accounts
      required:
      - id
      - status
      - code
      - title
      - detail
      - meta
