openapi: 3.2.0
info:
  version: 1.0.0
  title: Accrue Merchant Webhook Topics API
  x-links:
  - name: View Alternative Version
    url: /api-fs/
    description: View API documentation with alternative enum-based WebhookIncluded schema
  description: Webhook Topics
servers:
- description: Production API
  url: https://merchant-api.accruesavings.com
- description: Sandbox API
  url: https://merchant-api-sandbox.accruesavings.com
tags:
- name: Webhook Topics
  description: Webhook Topics
paths: {}
webhooks:
  paymentIntentCreated:
    post:
      operationId: paymentIntentCreated
      tags:
      - Webhook Topics
      summary: PaymentIntentCreated
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier for the object.
                          readOnly: true
                        type:
                          type: string
                          enum:
                          - PaymentIntent
                        attributes:
                          type: object
                          properties:
                            balance:
                              allOf:
                              - $ref: '#/components/schemas/PaymentIntentBalanceInformation'
                              - description: Optional wallet balance information
                            billingAddress:
                              type:
                              - object
                              - 'null'
                              properties:
                                street:
                                  type:
                                  - string
                                  - 'null'
                                street2:
                                  type:
                                  - string
                                  - 'null'
                                city:
                                  type:
                                  - string
                                  - 'null'
                                state:
                                  type:
                                  - string
                                  - 'null'
                                postalCode:
                                  type:
                                  - string
                                  - 'null'
                                country:
                                  type:
                                  - string
                                  - 'null'
                              required:
                              - street
                              - street2
                              - city
                              - state
                              - postalCode
                              - country
                            email:
                              type:
                              - string
                              - 'null'
                              format: email
                            error:
                              type:
                              - string
                              - 'null'
                              enum:
                              - LinkedAccountUnverified
                              - LinkedAccountDisconnected
                              - LinkedAccountMissing
                              - InsufficientBalance
                              - MissingFullName
                              - WrongEmail
                              - InvalidKycStatus
                              description: Specific error associated with the current invalid status.
                            expiresAt:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: The datetime at which the payment intent is set to expire. After this time, the intent cannot be promoted to a payment and is considered expired.
                              readOnly: true
                            fullName:
                              type:
                              - string
                              - 'null'
                            phoneNumber:
                              type:
                              - string
                              - 'null'
                            amount:
                              type: integer
                              description: Total purchase amount in cents.
                              format: int32
                              example: 3600
                            reference:
                              type:
                              - string
                              - 'null'
                              description: Reference to the data inside an external system.
                              example: MERCHANT-GENERATED-TOKEN
                            status:
                              type: string
                              enum:
                              - Promotable
                              - PromotedToPayment
                              - Invalid
                              - Expired
                              - Canceled
                              description: The current status of the payment intent. Each status represents a different stage in the payment intent lifecycle, from creation to completion or cancellation.
                            userId:
                              type:
                              - string
                              - 'null'
                            walletId:
                              type:
                              - string
                              - 'null'
                              description: The ID of the wallet for which the payment intent is created.
                              example: 123e4567-e89b-12d3-a456-426614174000
                            updatedAt:
                              type: string
                              format: date-time
                              readOnly: true
                            createdAt:
                              type: string
                              format: date-time
                              readOnly: true
                          required:
                          - updatedAt
                          - createdAt
                      required:
                      - id
                      - type
                      - attributes
                required:
                - included
              description: ''
              x-tags: Model
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
