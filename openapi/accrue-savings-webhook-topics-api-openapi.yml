  refundCreated:
    post:
      operationId: refundCreated
      tags:
      - Webhook Topics
      summary: RefundCreated
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier for the object.
                          readOnly: true
                        type:
                          type: string
                          enum:
                          - Refund
                        attributes:
                          type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - Failed
                              - Pending
                              - Sent
                              - Waiting
                              description: The current status of the refund.
                            amount:
                              type: integer
                              description: The amount refunded, represented in the smallest currency unit (e.g., cents for USD). To obtain the value in dollars, divide by 100.
                              format: int32
                              example: 9999
                            message:
                              type: string
                              description: A human-readable message describing the refund status or outcome.
                              example: 'Refund processed. Fee: 59 cents'
                            reference:
                              type:
                              - string
                              - 'null'
                              description: Reference inherited from the parent Payment. This is not a direct field on the Refund entity.
                              example: MERCHANT-GENERATED-TOKEN
                            charges:
                              type: object
                              properties:
                                fee:
                                  type: object
                                  properties:
                                    amount:
                                      type: integer
                                      minimum: 0
                                      description: Fee amount in cents
                                      format: int32
                                      example: 59
                                    type:
                                      type: string
                                      description: Fee type identifier. For refunds, this is `pay_by_wallet_refund`.
                                      example: pay_by_wallet_refund
                                  required:
                                  - amount
                                  - type
                                  description: Processing fee details for this refund
                                rewards:
                                  type: integer
                                  minimum: 0
                                  description: Rewards amount. Always 0 for refunds (rewards are not applicable to refunds).
                                  format: int32
                                  example: 0
                              description: Charges applied to this refund.
                            deductions:
                              type: object
                              properties:
                                rewards:
                                  type: integer
                                  minimum: 0
                                  description: Rewards amount. Always 0 for refunds.
                                  format: int32
                                  example: 0
                                fees:
                                  type: integer
                                  minimum: 0
                                  description: Processing fees charged for this refund, in cents. Same value as `charges.fee.amount`.
                                  format: int32
                                  example: 59
                              required:
                              - rewards
                              - fees
                              description: Legacy charges breakdown. Use `charges` instead.
                              deprecated: true
                            id:
                              type: string
                              format: uuid
                              example: 9f755746-13cb-4d0b-81f2-3b4f1b44f6d8
                            updatedAt:
                              type: string
                              format: date-time
                              readOnly: true
                            createdAt:
                              type: string
                              format: date-time
                              readOnly: true
                          required:
                          - updatedAt
                          - createdAt
                      required:
                      - id
                      - type
                      - attributes
                required:
                - included
              description: ''
              x-tags: Model
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
