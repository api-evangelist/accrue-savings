        '200':
          description: Return a 200 status to indicate that the data was received successfully
  counterpartyPayoutCreated:
    post:
      operationId: counterpartyPayoutCreated
      tags:
      - Webhook Topics
      summary: CounterpartyPayoutCreated
      description: 'Fired when a payout is created for a counterparty and submitted for processing. `status` is the payout''s initial state, which may be `Approved`, `NeedsApproval`, or `Processing` depending on your approval configuration.


        A duplicate create — the same idempotency key replayed — returns the existing payout and does **not** fire a second event.


        The included payload mirrors the payout resource — **payoutId**, **counterpartyId**, **amount** (in cents), **currency**, **status**, **description**, and **effectiveDate** — so you can act on the event without re-reading the payouts API.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookCounterpartyPayout'
                required:
                - included
              description: ''
              x-tags: Model
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
  counterpartyPayoutSent:
    post:
      operationId: counterpartyPayoutSent
      tags:
      - Webhook Topics
      summary: CounterpartyPayoutSent
      description: 'Fired when the payout has been sent to the bank. The funds have left, but the payment is not yet reconciled — a payout can sit in this state for a few days depending on the rail, and can still be returned afterwards. Wait for `CounterpartyPayoutCompleted` before treating the money as delivered.


        The included payload mirrors the payout resource — **payoutId**, **counterpartyId**, **amount** (in cents), **currency**, **status**, **description**, and **effectiveDate** — so you can act on the event without re-reading the payouts API.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookCounterpartyPayout'
                required:
                - included
              description: ''
              x-tags: Model
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
  counterpartyPayoutCompleted:
    post:
      operationId: counterpartyPayoutCompleted
      tags:
      - Webhook Topics
      summary: CounterpartyPayoutCompleted
      description: 'Fired when the payout has been reconciled to a posted bank transaction. This is the terminal success state: the funds have settled at the receiving bank.


        The included payload mirrors the payout resource — **payoutId**, **counterpartyId**, **amount** (in cents), **currency**, **status**, **description**, and **effectiveDate** — so you can act on the event without re-reading the payouts API.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookCounterpartyPayout'
                required:
                - included
              description: ''
              x-tags: Model
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
  counterpartyPayoutReturned:
    post:
      operationId: counterpartyPayoutReturned
      tags:
      - Webhook Topics
      summary: CounterpartyPayoutReturned
      description: 'Fired when a payout ends without delivering funds. This covers every terminal failure — returned, reversed, cancelled, denied, and failed — so read **status** to see which occurred rather than relying on the topic name.


        **returnCode** and **returnReason** are populated when the receiving bank returned the payment (for example `R01`, insufficient funds) and are null for the other failures. The payout amount is available on the counterparty balance again.


        The included payload mirrors the payout resource — **payoutId**, **counterpartyId**, **amount** (in cents), **currency**, **status**, **description**, and **effectiveDate** — so you can act on the event without re-reading the payouts API.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookCounterpartyPayoutReturned'
                required:
                - included
              description: ''
              x-tags: Model
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
components:
  schemas:
    WebhookCounterpartyPayoutReturned:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - CounterpartyPayoutReturned
        attributes:
          allOf:
          - $ref: '#/components/schemas/CounterpartyPayoutEventAttributes'
          - type: object
            properties:
              returnCode:
                type:
                - string
                - 'null'
                description: Bank return code when the payout was returned by the receiving bank (for example `R01`). Null for the other terminal failures, which carry no bank return.
                example: R01
              returnReason:
                type:
                - string
                - 'null'
                description: Human-readable reason for the return, when the bank supplied one
                example: insufficient funds
              reference:
                type:
                - string
                - 'null'
              email:
                type:
                - string
                - 'null'
                format: email
              fullName:
                type:
                - string
                - 'null'
              phoneNumber:
                type:
                - string
                - 'null'
              error:
                type:
                - string
                - 'null'
              walletId:
                type:
                - string
                - 'null'
                format: uuid
              billingAddress:
                type:
                - object
                - 'null'
                additionalProperties: {}
            required:
            - returnCode
            - returnReason
      required:
      - id
      - type
      - attributes
      description: CounterpartyPayoutReturned event data as stored in webhook payload
      x-tags:
      - Model
    CounterpartyIncomingPaymentEventAttributes:
      type: object
      properties:
        counterpartyId:
          type: string
          format: uuid
          description: The counterparty whose account received the payment
          example: 123e4567-e89b-12d3-a456-426614174000
        merchantId:
          type: string
          format: uuid
          description: The merchant that owns the counterparty
          example: 123e4567-e89b-12d3-a456-426614174000
        amount:
          type: integer
          description: The payment amount, represented in the smallest currency unit (e.g., cents for USD).
          example: 2500
        currency:
          type: string
          description: ISO 4217 currency code of the payment
          example: USD
        direction:
          type: string
          enum:
          - credit
          - debit
          description: 'Direction of the movement on the counterparty account.


            - **credit**: funds were received into the counterparty account.

            - **debit**: funds were withdrawn from the counterparty account.'
          example: credit
        method:
          type: string
          description: The bank rail the payment arrived over, for example `ach`, `wire`, or `rtp`. Treat this as an open set — new values may be added without notice.
          example: ach
        asOfDate:
          type: string
          description: The date the payment settled at the bank, as `YYYY-MM-DD`
          example: '2026-08-27'
        externalIncomingPaymentId:
          type: string
          description: Identifier for this incoming payment at the banking provider. Stable for the life of the payment and safe to use for reconciliation against your bank records.
          example: ipd_a1b2c3d4e5
      required:
      - counterpartyId
      - merchantId
      - amount
      - currency
      - direction
      - method
      - asOfDate
      - externalIncomingPaymentId
    Kyc:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the object.
          readOnly: true
        type:
          type: string
          enum:
          - Kyc
        attributes:
          type: object
          properties:
            status:
              type: string
              enum:
              - Approved
              - AwaitingDocuments
              - Denied
              - ManualReview
              - NotStarted
              - Pending
              - Unknown
              description: The current status of the user's KYC verification
              example: Approved
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
          required:
          - status
          - updatedAt
          - createdAt
      required:
      - id
      - type
      - attributes
      description: KYC verification status for a user
      x-tags:
      - Model
    CounterpartyPayoutEventAttributes:
      type: object
      properties:
        payoutId:
          type: string
          description: The payout id, identical to the one the payouts API returns
          example: po_a1b2c3d4e5
        counterpartyId:
          type: string
          format: uuid
          description: The counterparty being paid out
          example: 123e4567-e89b-12d3-a456-426614174000
        merchantId:
          type: string
          format: uuid
          description: The merchant that owns the counterparty
          example: 123e4567-e89b-12d3-a456-426614174000
        amount:
          type: integer
          description: The payout amount, represented in the smallest currency unit (e.g., cents for USD).
          example: 5000
        currency:
          type: string
          description: ISO 4217 currency code of the payout
          example: USD
        status:
          type: string
          enum:
          - Approved
          - Cancelled
          - Completed
          - Denied
          - Failed
          - NeedsApproval
          - Pending
          - Processing
          - Returned
          - Reversed
          - Sent
          description: The payout status at the time the event fired. This is the same status the payouts API reports, so a webhook and a subsequent read always agree.
          example: Sent
        description:
          type:
          - string
          - 'null'
          description: Description recorded on the payout
          example: Payout to Acme Vendor
        effectiveDate:
          type: string
          description: The date the payout is scheduled to settle, as `YYYY-MM-DD`
          example: '2026-08-28'
        createdAt:
          type: string
          description: ISO 8601 timestamp
        updatedAt:
          type: string
          description: ISO 8601 timestamp
      required:
      - payoutId
      - counterpartyId
      - merchantId
      - amount
      - currency
      - status
      - description
      - effectiveDate
      - createdAt
      - updatedAt
    PaymentIntentBalanceInformation:
