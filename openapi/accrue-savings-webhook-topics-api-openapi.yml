  paymentCaptured:
    post:
      operationId: paymentCaptured
      tags:
      - Webhook Topics
      summary: PaymentCaptured
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  included:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier for the object.
                          readOnly: true
                        type:
                          type: string
                          enum:
                          - Capture
                        attributes:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: Capture ID
                              example: 123e4567-e89b-12d3-a456-426614174000
                            amount:
                              type: integer
                              description: The total amount of the payment captured, represented in the smallest currency unit (e.g., cents for USD). To obtain the value in dollars, divide by 100.
                              format: int32
                              example: 9999
                            success:
                              type: boolean
                              description: Indicates whether the capture was successful.
                              example: true
                            method:
                              type: string
                              enum:
                              - BankRails
                              - VirtualDebitCard
                              description: The payment method used to capture the payment.
                              example: VirtualDebitCard
                            reference:
                              type:
                              - string
                              - 'null'
                              description: Reference to the data inside an external system.
                              example: MERCHANT-GENERATED-TOKEN
                            updatedAt:
                              type: string
                              format: date-time
                              readOnly: true
                            createdAt:
                              type: string
                              format: date-time
                              readOnly: true
