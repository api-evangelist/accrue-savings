  counterpartyIncomingPayment:
    post:
      operationId: counterpartyIncomingPayment
      tags:
      - Webhook Topics
      summary: CounterpartyIncomingPayment
      description: 'Fired when a payment arrives on a counterparty''s bank account and has been recorded on the counterparty''s balance. Use this to reconcile funding you receive from a counterparty over bank rails without polling the counterparty balance.


        The included payload carries **counterpartyId**, **amount** (in cents), **currency**, **direction** (`credit` for funds received, `debit` for funds withdrawn), **method** (the bank rail, for example `ach` or `wire`), **asOfDate** (the bank settlement date), and **externalIncomingPaymentId** for reconciliation against your bank records.


        This event is only sent after the payment has been recorded, so the counterparty balance already reflects it when you receive the webhook.'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEvent'
              - type: object
                properties:
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookCounterpartyIncomingPayment'
                required:
                - included
              description: ''
              x-tags: Model
