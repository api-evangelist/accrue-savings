    RewardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the object.
          readOnly: true
        type:
          type: string
          enum:
          - Reward
        attributes:
          type: object
          properties:
            kind:
              type: string
              enum:
              - immediate
              - preIssued
              description: Informational discriminator only. Use `canUpdate` and `canCancel` to decide which operations are allowed — do not branch behavior on `kind` alone.
              example: immediate
            amount:
              type: integer
              exclusiveMinimum: 0
              description: Reward amount in cents.
              format: int32
              example: 500
            walletId:
              type:
              - string
              - 'null'
              format: uuid
              description: Wallet that received the reward. Set for immediate credits; `null` for pre-issued rewards awaiting claim.
              example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
            status:
              type: string
              enum:
              - Credited
              - Created
              - Claimed
              - Expired
              - Cancelled
              description: Unified lifecycle status. Immediate wallet credits are `Credited`; pre-issued rewards use `Created`, `Claimed`, `Expired`, or `Cancelled`.
              example: Credited
            canUpdate:
              type: boolean
              description: Whether `PATCH /api/v1/rewards/{id}` is allowed for this reward.
              example: false
            canCancel:
              type: boolean
              description: Whether `DELETE /api/v1/rewards/{id}` is allowed for this reward.
              example: false
            claimExpiresAt:
              type:
              - string
              - 'null'
              format: date-time
              description: When a pre-issued reward must be claimed before it expires. `null` for immediate wallet credits.
              example: '2026-09-15T12:00:00.000Z'
            message:
              type:
              - string
              - 'null'
              description: Optional message attached to the reward.
              example: Thank you for your loyalty!
            reasonCode:
              type:
              - string
              - 'null'
              description: Partner-defined reason code for reporting and reconciliation.
              example: CX-COMPENSATION-001
            costCenter:
              type:
              - string
              - 'null'
              description: Partner-defined cost center for reporting.
              example: CX-SUPPORT
            notificationEmail:
              type:
              - string
              - 'null'
              format: email
              description: Email address to notify when a pre-issued reward is claimed.
              example: agent@partner.example
          required:
          - kind
          - amount
          - walletId
          - status
          - canUpdate
          - canCancel
          - claimExpiresAt
          - message
          - reasonCode
          - costCenter
          - notificationEmail
      required:
      - id
      - type
      - attributes
      description: Unified reward resource for both immediate wallet credits and pre-issued rewards awaiting claim.
      x-tags:
      - Model
