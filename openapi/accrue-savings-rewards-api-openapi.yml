    IssueRewardRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - IssueReward
        attributes:
          type: object
          properties:
            phoneNumber:
              type: string
              minLength: 1
              description: Recipient phone number in E.164 or supported national format.
              example: '+15551234567'
            amount:
              type: integer
              exclusiveMinimum: 0
              maximum: 2147483647
              description: Reward amount in cents. Must be a positive integer.
              format: int32
              example: 500
            idempotencyKey:
              type: string
              minLength: 1
              maxLength: 255
              description: Required idempotency key (1–255 characters). Idempotency is scoped to this key plus a server-computed SHA-256 fingerprint of the normalized phone number, amount, and optional metadata fields (`message`, `reasonCode`, `costCenter`, `notificationEmail`). Reusing the same key with an identical request body returns the original result. Reusing the key with any change to those fields returns `409 IdempotencyConflict`.
              example: reward-2025-06-11-001
            message:
              type: string
              description: Optional message shown to the recipient.
              example: Thanks for being a valued customer!
            reasonCode:
              type: string
              description: Partner-defined reason code.
              example: CX-COMPENSATION-001
            costCenter:
              type: string
              description: Partner-defined cost center.
              example: CX-SUPPORT
            notificationEmail:
              type: string
              format: email
              description: Email to notify when a pre-issued reward is claimed.
              example: agent@partner.example
          required:
          - phoneNumber
          - amount
          - idempotencyKey
