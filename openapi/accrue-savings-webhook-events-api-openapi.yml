          - $ref: '#/components/schemas/TransactionEventAttributes'
          - type: object
            properties:
              reference:
                type:
                - string
                - 'null'
              email:
                type:
                - string
                - 'null'
                format: email
              fullName:
                type:
                - string
                - 'null'
