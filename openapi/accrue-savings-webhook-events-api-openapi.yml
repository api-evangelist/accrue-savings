      - counterpartyId
      - merchantId
      - amount
      - currency
      - direction
      - method
      - asOfDate
      - externalIncomingPaymentId
    CounterpartyPayoutEventAttributes:
      type: object
      properties:
        payoutId:
          type: string
          description: The payout id, identical to the one the payouts API returns
          example: po_a1b2c3d4e5
        counterpartyId:
          type: string
          format: uuid
          description: The counterparty being paid out
          example: 123e4567-e89b-12d3-a456-426614174000
        merchantId:
          type: string
          format: uuid
          description: The merchant that owns the counterparty
          example: 123e4567-e89b-12d3-a456-426614174000
        amount:
          type: integer
          description: The payout amount, represented in the smallest currency unit (e.g., cents for USD).
          example: 5000
        currency:
          type: string
          description: ISO 4217 currency code of the payout
          example: USD
        status:
          type: string
          enum:
          - Approved
          - Cancelled
          - Completed
          - Denied
          - Failed
          - NeedsApproval
          - Pending
          - Processing
          - Returned
          - Reversed
          - Sent
          description: The payout status at the time the event fired. This is the same status the payouts API reports, so a webhook and a subsequent read always agree.
          example: Sent
        description:
          type:
          - string
          - 'null'
          description: Description recorded on the payout
          example: Payout to Acme Vendor
        effectiveDate:
          type: string
          description: The date the payout is scheduled to settle, as `YYYY-MM-DD`
          example: '2026-08-28'
        createdAt:
          type: string
          description: ISO 8601 timestamp
        updatedAt:
          type: string
          description: ISO 8601 timestamp
      required:
      - payoutId
      - counterpartyId
      - merchantId
      - amount
      - currency
      - status
      - description
      - effectiveDate
      - createdAt
      - updatedAt
