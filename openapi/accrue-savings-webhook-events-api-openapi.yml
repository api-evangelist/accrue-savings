                additionalProperties: {}
              fee:
                type: object
                properties:
                  type:
                    type:
                    - string
                    - 'null'
                    description: The fee type applied to this transaction (for example, a specific FeeType name). This value can be null when no fee type applies or the fee type cannot be determined.
                    example: JitFundingFee
                  amount:
                    type: integer
                    description: The fee amount applied to this transaction, represented in the smallest currency unit (e.g., cents for USD). This value can be 0 when no fee was charged.
                    example: 125
                required:
                - type
                - amount
                description: Fee breakdown applied to this transaction.
              failureReason:
                type: string
                enum:
                - Canceled
                - HardDecline
                - SoftDecline
                - Expired
                - InsufficientFunds
                - Reversed
                - Unknown
                description: 'Transaction failure reason (TransactionFailureReason).


                  - **Canceled**: The transaction was canceled.

                  - **HardDecline**: The request was declined (hard decline).

                  - **SoftDecline**: The payment request was declined; subsequent attempts may succeed.

                  - **Expired**: The transaction or authorization expired.

                  - **InsufficientFunds**: Insufficient funds to complete the transaction.

                  - **Reversed**: The transaction was reversed.

                  - **Unknown**: The failure reason is unknown.'
                example: SoftDecline
            required:
            - fee
