components:
  schemas:
    WebhookRefund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - Refund
        attributes:
          type: object
          properties:
            id:
              type: string
              format: uuid
            paymentId:
              type: string
              format: uuid
            amount:
              type: integer
            status:
              type: string
              enum:
              - Failed
              - Pending
              - Sent
              - Waiting
            message:
              type: string
            reference:
              type:
              - string
              - 'null'
            charges:
              type: object
              properties:
                fee:
                  type: object
                  properties:
                    amount:
                      type: integer
                      minimum: 0
                      description: Fee amount in cents
                      format: int32
                      example: 59
                    type:
                      type: string
                      description: Fee type identifier
                      example: pay_by_wallet_refund
                  required:
                  - amount
                  - type
                  description: Processing fee details for this refund
                rewards:
                  type: integer
                  minimum: 0
                  description: Rewards amount. Always 0 for refunds.
                  format: int32
                  example: 0
              description: Charges applied to this refund.
            deductions:
              type: object
              properties:
                rewards:
                  type: integer
                  minimum: 0
                  description: Rewards amount. Always 0 for refunds.
                  format: int32
                  example: 0
                fees:
                  type: integer
                  minimum: 0
                  description: Processing fees charged for this refund, in cents.
                  format: int32
                  example: 59
              required:
              - rewards
              - fees
              description: Legacy charges breakdown. Use `charges` instead.
              deprecated: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
          - id
          - amount
          - status
          - message
          - createdAt
          - updatedAt
      required:
      - id
      - type
      - attributes
      description: Refund entity as stored in webhook payload. Includes charges/deductions via shared mapRefundCharges utility.
      x-tags:
      - Model
    WebhookEventQueryValidationErrorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 400
        code:
          type: string
          enum:
          - BadRequest
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: BadRequest
        title:
          type: string
          description: Generic title for the error.
          example: ValidationError
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - 'Validation failed for page[limit]: expected number'
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/webhook-events
          required:
          - environment
          - timestamp
          - path
          example:
            environment: sandbox
            timestamp: '2025-06-23T12:00:00.000Z'
            path: /api/v1/webhook-events
      required:
      - id
      - status
      - code
      - title
      - detail
      - meta
    TransactionEventAttributes:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
          description: The transaction ID associated with this event
          example: 123e4567-e89b-12d3-a456-426614174000
        walletId:
          type: string
          format: uuid
          description: The wallet ID associated with this transaction
          example: 123e4567-e89b-12d3-a456-426614174000
        rewardIds:
          type: array
          items:
            type: string
            format: uuid
          description: Optional array of reward IDs associated with this transaction
          example: []
      required:
      - transactionId
      - walletId
    ApplicationCreatedEventAttributes:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/BankApplicationLite'
        userId:
          type: string
          format: uuid
          description: The user ID associated with this event
          example: 123e4567-e89b-12d3-a456-426614174000
        provider:
          type: string
          description: Bank provider (e.g., 'Unit', 'ModernTreasury')
          example: Unit
      required:
      - application
      - userId
      - provider
    WebhookCounterpartyPayout:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - CounterpartyPayoutCreated
          - CounterpartyPayoutSent
          - CounterpartyPayoutCompleted
        attributes:
          allOf:
          - $ref: '#/components/schemas/CounterpartyPayoutEventAttributes'
          - type: object
            properties:
              reference:
                type:
                - string
                - 'null'
              email:
                type:
                - string
                - 'null'
                format: email
              fullName:
                type:
                - string
                - 'null'
              phoneNumber:
                type:
                - string
                - 'null'
              error:
                type:
                - string
                - 'null'
              walletId:
                type:
                - string
                - 'null'
                format: uuid
              billingAddress:
                type:
                - object
                - 'null'
                additionalProperties: {}
      required:
      - id
      - type
      - attributes
      description: Counterparty payout lifecycle event data (CounterpartyPayoutCreated, CounterpartyPayoutSent, CounterpartyPayoutCompleted) as stored in webhook payload
      x-tags:
      - Model
    WebhookIncluded:
      description: Polymorphic schema for webhook included resources. Uses discriminator on 'type' field for runtime deserialization.
      x-tags:
      - Model
      discriminator:
        propertyName: type
        mapping:
          PaymentIntent: '#/components/schemas/WebhookPaymentIntent'
          Payment: '#/components/schemas/WebhookPayment'
          Refund: '#/components/schemas/WebhookRefund'
          Capture: '#/components/schemas/WebhookCapture'
          KycCreated: '#/components/schemas/WebhookKycCreated'
          KycApproved: '#/components/schemas/WebhookKycApproved'
          KycDeclined: '#/components/schemas/WebhookKycStatus'
          KycPending: '#/components/schemas/WebhookKycStatus'
          KycAwaitingDocuments: '#/components/schemas/WebhookKycStatus'
          KycManualReview: '#/components/schemas/WebhookKycStatus'
          TransactionCleared: '#/components/schemas/WebhookTransactionCleared'
          TransactionFailed: '#/components/schemas/WebhookTransactionFailed'
          CounterpartyIncomingPayment: '#/components/schemas/WebhookCounterpartyIncomingPayment'
          CounterpartyPayoutCreated: '#/components/schemas/WebhookCounterpartyPayout'
          CounterpartyPayoutSent: '#/components/schemas/WebhookCounterpartyPayout'
          CounterpartyPayoutCompleted: '#/components/schemas/WebhookCounterpartyPayout'
          CounterpartyPayoutReturned: '#/components/schemas/WebhookCounterpartyPayoutReturned'
      oneOf:
      - $ref: '#/components/schemas/WebhookPaymentIntent'
      - $ref: '#/components/schemas/WebhookPayment'
      - $ref: '#/components/schemas/WebhookRefund'
      - $ref: '#/components/schemas/WebhookCapture'
      - $ref: '#/components/schemas/WebhookKycCreated'
      - $ref: '#/components/schemas/WebhookKycApproved'
      - $ref: '#/components/schemas/WebhookKycStatus'
      - $ref: '#/components/schemas/WebhookTransactionCleared'
      - $ref: '#/components/schemas/WebhookTransactionFailed'
      - $ref: '#/components/schemas/WebhookCounterpartyIncomingPayment'
      - $ref: '#/components/schemas/WebhookCounterpartyPayout'
      - $ref: '#/components/schemas/WebhookCounterpartyPayoutReturned'
    CounterpartyIncomingPaymentEventAttributes:
      type: object
      properties:
        counterpartyId:
          type: string
          format: uuid
          description: The counterparty whose account received the payment
          example: 123e4567-e89b-12d3-a456-426614174000
        merchantId:
          type: string
          format: uuid
          description: The merchant that owns the counterparty
          example: 123e4567-e89b-12d3-a456-426614174000
        amount:
          type: integer
          description: The payment amount, represented in the smallest currency unit (e.g., cents for USD).
          example: 2500
        currency:
          type: string
          description: ISO 4217 currency code of the payment
          example: USD
        direction:
          type: string
          enum:
          - credit
          - debit
          description: 'Direction of the movement on the counterparty account.


            - **credit**: funds were received into the counterparty account.

            - **debit**: funds were withdrawn from the counterparty account.'
          example: credit
        method:
          type: string
          description: The bank rail the payment arrived over, for example `ach`, `wire`, or `rtp`. Treat this as an open set — new values may be added without notice.
          example: ach
        asOfDate:
          type: string
          description: The date the payment settled at the bank, as `YYYY-MM-DD`
          example: '2026-08-27'
        externalIncomingPaymentId:
          type: string
          description: Identifier for this incoming payment at the banking provider. Stable for the life of the payment and safe to use for reconciliation against your bank records.
          example: ipd_a1b2c3d4e5
