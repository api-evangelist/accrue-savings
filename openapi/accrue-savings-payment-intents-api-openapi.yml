openapi: 3.2.0
info:
  version: 1.0.0
  title: Accrue Merchant Payment Intents API
  x-links:
  - name: View Alternative Version
    url: /api-fs/
    description: View API documentation with alternative enum-based WebhookIncluded schema
  description: Payment Intents represent a commitment to pay a specified amount, allowing for a structured process to handle payments from initiation to completion.
servers:
- description: Production API
  url: https://merchant-api.accruesavings.com
- description: Sandbox API
  url: https://merchant-api-sandbox.accruesavings.com
tags:
- name: Payment Intents
  description: Payment Intents represent a commitment to pay a specified amount, allowing for a structured process to handle payments from initiation to completion.
paths:
  /api/v1/payment-intents:
    post:
      operationId: createPaymentIntent
      tags:
      - Payment Intents
      summary: Create a Payment Intent
      description: 'Create a payment intent using `amount` and exactly one of `walletId` or `lookUpId`.


        When `walletId` is provided, the wallet is validated for the request merchant.


        When `lookUpId` is provided, the scanned string is resolved as a wallet barcode first; if no wallet barcode matches, it is resolved as a gift identifier. Never send a gift `data.id` as `walletId`. A wallet barcode `lookUpId` follows the wallet scan-and-pay flow.


        Gift look-ups skip KYC. `balance.available` is the remaining spendable amount (gift remaining, or wallet available).


        For a **gift** `lookUpId`, point-of-sale should first fetch remaining via Get Gift by lookUpId (`/api/v1/gifts/{lookUpId}`), then POST this endpoint with the **same** scanned string as `lookUpId`. Authorize returns a Payment whose `links.virtualDebitCard` is the gift virtual debit card. Gift remaining is spent later by card-present authorization of that card; authorize does not debit the gift reserve.'
      parameters:
      - schema:
          type: string
          format: uuid
          description: The unique identifier of the client making the request. This header is required to retrieve the client-specific configuration and ensure that the response is tailored to the client's settings and permissions.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/CreatePaymentIntent'
              required:
              - data
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentResponse'
        '400':
          description: Invalid amount or wallet identifier validation failed
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentInvalidResponse'
        '403':
          description: Wallet access denied
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentWalletAccessDeniedResponse'
        '404':
          description: Wallet identifier not found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreatePaymentIntentWalletNotFoundResponse'
