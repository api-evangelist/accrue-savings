  /api/v1/payment-intents/{paymentIntentId}/authorize:
    post:
      operationId: authorizePayment
      tags:
      - Payment Intents
      summary: Authorize Payment
      description: 'Authorize a payment intent, creating a `Payment`. For wallet payment intents this also reserves wallet funds.


        If the payment intent was already authorized (an active payment exists), the existing payment is returned without re-authorizing.


        When the client has a card processor configured, processor authorization runs inline before the response is returned — for both wallet and gift payment intents. On success, `included` Payment resources may include `meta.processor` with an opaque processor payload. On processor decline, the payment is marked `Failed` and the endpoint returns `402`.


        For a gift `lookUpId` payment intent, authorize still creates a `Payment` and, when a card processor is configured, still runs processor authorization inline. It does not debit the gift reserve or reserve wallet funds. After a successful authorize, load the Payment''s `links.virtualDebitCard` via Get Virtual Debit Card (`/api/v1/payments/{paymentId}/card`). Card-present authorization of that card is what spends remaining gift balance.


        Optional `data.attributes.channel` and `data.attributes.risk.deviceSessionId` are forwarded to wallet authorization. When a wallet is attached, `data.attributes.balance` on the returned payment intent may be present.'
      parameters:
      - schema:
          type: string
          format: uuid
          description: Payment Intent ID
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: paymentIntentId
        in: path
      - schema:
          type: string
          format: uuid
          description: The unique identifier of the client making the request. This header is required to retrieve the client-specific configuration and ensure that the response is tailored to the client's settings and permissions.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/AuthorizePaymentIntent'
              required:
              - data
      responses:
        '201':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthorizePaymentResponse'
        '402':
          description: Authorization failed for the desired amount
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthorizePaymentIntentFailedResponse'
        '403':
          description: Client/Payment Intent mismatch
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthorizePaymentIntentForbiddenResponse'
