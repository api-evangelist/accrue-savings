                    amount: 300
                    fee: 0
                    remit: true
                charges:
                  type: object
                  properties:
                    fee:
                      type: object
                      properties:
                        amount:
                          type: integer
                          minimum: 0
                          description: Fee amount in cents
                          format: int32
                          example: 150
                        type:
                          type: string
                          description: Fee type identifier (e.g., 'ACHFee', 'CardFee')
                          example: ACHFee
                      required:
                      - amount
                      - type
                      description: Processing fee details
                  description: Charges applied to this deposit.
                deductions:
                  type: object
                  properties:
                    fee:
                      type: integer
                      minimum: 0
                      description: Accrue processing fee in cents
                      format: int32
                      example: 150
                  required:
                  - fee
                  description: Legacy charges breakdown. Use `charges` instead.
                  deprecated: true
