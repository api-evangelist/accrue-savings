  /api/v1/wallets/:walletId/transactions:
    post:
      operationId: createOneTimeDeposit
      tags:
      - Wallets
      summary: Create One-Time Deposit
      description: 'Create a one-time deposit transaction for a wallet using an existing linked account.


        Merchants can optionally include a `disbursement` array to split a portion of the total deposit among one or more counterparties. Any undisbursed amount is credited to the consumer''s wallet.


        Processing fees reported in `charges.fee` are collected from the counterparty configured as the Default for Fees on your merchant account.


        **Example:** A consumer deposits $13.00 (1300 cents) with a $3.00 (300 cents) disbursement to counterparty A. Counterparty A receives $3.00 and the consumer''s wallet is credited the remaining $10.00 (1000 cents).'
      parameters:
      - schema:
          type: string
          format: uuid
          description: The wallet ID to deposit to.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: walletId
        in: path
      - schema:
          type: string
          format: uuid
          description: The unique identifier of the client making the request. This header is required to retrieve the client-specific configuration and ensure that the response is tailored to the client's settings and permissions.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - OneTimeDeposit
                    attributes:
                      type: object
                      properties:
                        amount:
                          type: integer
                          minimum: 100
                          description: The amount to deposit, represented in the smallest currency unit (e.g., cents for USD). Minimum is 100 (e.g., $1.00). To obtain the value in dollars, divide by 100.
                          format: int32
                          example: 1000
                        idempotencyKey:
                          type: string
                          format: uuid
                          description: A unique key (UUID) to ensure idempotency of the request. Reusing the same key will not create multiple deposits.
                          example: 123e4567-e89b-12d3-a456-426614174000
                        linkedAccountId:
                          type: string
                          format: uuid
                          description: The linked account ID to use for the deposit.
                          example: 123e4567-e89b-12d3-a456-426614174000
                        disbursement:
                          type: array
                          items:
                            type: object
                            properties:
                              amount:
                                type: integer
                                minimum: 1
                                description: The fee amount included in the total deposit amount, represented in the smallest currency unit (e.g., cents for USD). This amount will be disbursed to the specified counterparty. The remaining amount (deposit amount - disbursement amount) will be credited to the user's wallet.
                                format: int32
                                example: 300
                              counterpartyId:
                                type: string
                                format: uuid
                                description: The ID of the counterparty who will receive the disbursement amount.
                                example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                              remit:
                                type: boolean
                                description: Deprecated. This field is accepted but always treated as `true` regardless of the value provided. All disbursements are remitted directly. Will be removed in a future version.
                                example: true
                                deprecated: true
                            required:
                            - amount
                            - counterpartyId
                          description: Optional array of fee disbursements included in the total deposit amount. When provided, the specified amounts will be disbursed to their respective counterparties, and the remainder will be credited to the user's wallet.
                          example:
                          - amount: 300
                            counterpartyId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                        risk:
                          type: object
                          properties:
                            deviceSessionId:
                              type: string
                              description: Device session ID used for risk assessment. Optional but recommended for production traffic.
                          required:
                          - deviceSessionId
                      required:
                      - amount
                      - idempotencyKey
                      - linkedAccountId
                  required:
                  - type
                  - attributes
              required:
              - data
      responses:
        '201':
          description: 201 Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateOneTimeDepositResponse'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateOneTimeDepositErrorResponse'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateOneTimeDepositNotFoundResponse'
        '500':
          description: Internal Server Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UnexpectedErrorForWalletResponse'
