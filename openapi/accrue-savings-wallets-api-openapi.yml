            originalCode:
              type: string
              description: 'The original card processor response code. This field is only present for card deposit failures. For bank transfer (ACH) deposit failures, different error codes are returned (e.g., InsufficientFunds, ExceedACHLimit, LinkedAccountDisconnected) and this field is not included. Response codes are categorized by their prefix:

                - **10xxx**: Approved - The payment request was successful.

                - **20xxx**: Soft declines - The payment request was declined, though subsequent attempts may succeed.

                - **30xxx**: Hard declines - The request was declined. Most hard declines require the issuer or cardholder to fix any outstanding issues before you can retry.

                - **4xxxx**: Risk responses - The request raised a risk response. The response_code and status depend on the action specified in your Fraud Detection risk strategies.

                - **50xxx**: Card payout declines - The card payout request was declined.'
