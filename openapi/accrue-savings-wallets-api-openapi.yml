          examples:
          - Multiple wallets found for the provided user reference. Please use a more specific identifier.
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/wallets/123e4567-e89b-12d3-a456-426614174000/balance
          required:
          - environment
          - timestamp
          - path
          example:
            environment: sandbox
            timestamp: '2025-06-23T12:00:00.000Z'
            path: /api/v1/wallets/123e4567-e89b-12d3-a456-426614174000/balance
      required:
      - id
      - status
      - code
      - title
      - detail
      - meta
    ClosedLoopWithdrawResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: The wallet ID. Same as the `walletId` path parameter.
              example: 123e4567-e89b-12d3-a456-426614174000
            type:
              type: string
              enum:
              - Withdraw
            attributes:
              type: object
              properties:
                split:
                  type: array
                  items:
                    type: object
                    properties:
                      linkedAccountId:
                        type: string
                        format: uuid
                        description: The linked account ID that received (or will receive) this portion of the withdrawal.
                        example: 123e4567-e89b-12d3-a456-426614174000
                      institutionName:
                        type: string
                        description: Name of the financial institution for the linked account.
                        example: Example Bank
                      accountMask:
                        type: string
                        description: Masked account number (e.g., last four digits) for display.
                        example: '1234'
                      amount:
                        type: integer
                        description: Amount in cents allocated to this linked account.
                        example: 2500
                    required:
                    - linkedAccountId
                    - institutionName
                    - accountMask
                    - amount
                  description: Breakdown of the withdrawal across linked accounts. Each item indicates how much is allocated to each account.
              required:
              - split
          required:
          - id
          - type
          - attributes
      required:
      - data
    GetWalletBalanceErrorResponse:
      anyOf:
      - $ref: '#/components/schemas/MultipleWalletsFoundResponse'
      - $ref: '#/components/schemas/InvalidUuidSyntaxForWalletResponse'
