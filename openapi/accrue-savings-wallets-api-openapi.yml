components:
  schemas:
    WalletAlreadyExistsResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: A unique UUID for this particular occurrence of the problem.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: The HTTP status code applicable to this error.
          example: 400
        code:
          type: string
          enum:
          - WalletAlreadyExists
          description: A unique, camel-cased Accrue-specific code detailing the error.
          example: WalletAlreadyExists
        title:
          type: string
          description: Generic title for the error.
          example: WalletValidationException
        detail:
          type: string
          description: A human-readable explanation providing more insights about the error.
          examples:
          - A wallet for this user and merchant already exists.
        meta:
          type: object
          properties:
            environment:
              type: string
              enum:
              - production
              - sandbox
              example: sandbox
            timestamp:
              type: string
              format: date-time
              example: '2025-06-23T12:00:00.000Z'
            path:
              type: string
              example: /api/v1/wallets
          required:
          - environment
          - timestamp
          - path
          example:
            environment: sandbox
