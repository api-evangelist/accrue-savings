                  type: array
                  items:
                    type: object
                    properties:
                      counterpartyId:
                        type: string
                        format: uuid
                        description: The ID of the counterparty who will receive the net disbursement.
                        example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                      amount:
                        type: integer
                        description: The total disbursement amount from the deposit, represented in the smallest currency unit (e.g., cents for USD).
                        format: int32
                        example: 300
                      fee:
                        type: integer
                        description: Accrue's fee deducted from the disbursement amount. Always returns 0.
                        format: int32
                        example: 0
                        deprecated: true
                      remit:
                        type: boolean
                        description: Deprecated. Always returns `true`. All disbursements are remitted directly. Will be removed in a future version.
                        example: true
                        deprecated: true
                    required:
