      - lang: Php
        source: "<?php\n\n$request = new HttpRequest();\n$request->setUrl('https://merchant-api.accruesavings.com/api/v1/counterparty-transfers');\n$request->setMethod(HTTP_METH_POST);\n\n$request->setHeaders([\n  'Client-ID' => '123e4567-e89b-12d3-a456-426614174000',\n  'Authorization' => 'Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef'\n]);\n\ntry {\n  $response = $request->send();\n\n  echo $response->getBody();\n} catch (HttpException $ex) {\n  echo $ex;\n}"
  /api/v1/counterparty-transfers/:
    get:
      operationId: listCounterpartyTransfers
      tags:
      - CounterpartyTransfers
      summary: List Counterparty Transfers
      description: List all counterparty transfers for the authenticated partner.
      parameters:
      - schema:
          type: number
          minimum: 1
          maximum: 50
          default: 10
          description: Maximum number of objects that will be returned. Can not be greater than 50.
        required: false
        name: page[limit]
        in: query
      - schema:
          type: number
          minimum: 0
          default: 0
          description: Offset from the beginning of the list of objects. Can not be negative.
        required: false
        name: page[offset]
        in: query
      - schema:
          type: string
          format: uuid
          description: Filter transfers by source counterparty ID.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: false
        name: filter[fromCounterpartyId]
        in: query
      - schema:
          type: string
          format: uuid
          description: Filter transfers by destination counterparty ID.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: false
        name: filter[toCounterpartyId]
        in: query
      - schema:
          type: string
          enum:
          - Pending
          - Completed
          - Failed
          description: Filter transfers by status.
          example: Completed
        required: false
        name: filter[status]
        in: query
      - schema:
          type: string
          format: date-time
          description: Filter transfers created after this ISO 8601 datetime.
          example: '2024-01-01T00:00:00.000Z'
        required: false
        name: filter[createdAfter]
        in: query
      - schema:
          type: string
          format: date-time
          description: Filter transfers created before this ISO 8601 datetime.
          example: '2024-12-31T23:59:59.999Z'
        required: false
        name: filter[createdBefore]
        in: query
      - schema:
          type: string
          format: uuid
          description: The unique identifier of the client making the request. This header is required to retrieve the client-specific configuration and ensure that the response is tailored to the client's settings and permissions.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ListCounterpartyTransfersResponse'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CounterpartyTransferQueryValidationErrorResponse'
