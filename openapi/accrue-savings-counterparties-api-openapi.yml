              $ref: '#/components/schemas/CounterpartyExternalBankAccount'
            internalBankAccount:
              $ref: '#/components/schemas/CounterpartyInternalBankAccount'
            balance:
              type: object
              properties:
                pending:
                  type: integer
                  description: The balance associated with the counterparty not yet settled, in cents. Can exceed the int32 range — read it into a 64-bit integer.
                  format: int64
                  example: 1000
                available:
                  type: integer
                  description: Settled balance associated with the counterparty, in cents. Can exceed the int32 range — read it into a 64-bit integer. A single payout is capped below this (see the payout `amount` field), so a balance above that cap is paid out across multiple payouts.
