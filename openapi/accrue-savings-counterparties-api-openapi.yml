          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                      - CreateCounterpartyPayout
                    attributes:
                      type: object
                      properties:
                        amount:
                          type: integer
                          minimum: 1
                          maximum: 2147483647
                          description: Amount to payout in cents. Capped at 2147483647 ($21,474,836.47) per payout; a larger available balance must be paid out across multiple payouts.
                          format: int32
                          example: 5000
                        idempotencyKey:
                          type: string
                          minLength: 1
                          maxLength: 255
                          description: Idempotency key to prevent duplicate payouts
