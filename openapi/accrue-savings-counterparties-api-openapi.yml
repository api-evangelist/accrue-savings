    get:
      operationId: listCounterpartyPayouts
      tags:
      - Counterparties
      summary: List Counterparty Payouts
      description: List the payouts of a specific counterparty, newest first. `meta.total` counts the payouts matching the filters, so page through the list with `page[offset]` until you have read `meta.total` records. Both bounds of every filter range are inclusive.
      parameters:
      - schema:
          type: string
          format: uuid
          description: ID of the counterparty to fetch payouts for.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: counterpartyId
        in: path
      - schema:
          type: number
          minimum: 1
          maximum: 50
          default: 10
          description: Maximum number of objects that will be returned. Can not be greater than 50.
        required: false
        name: page[limit]
        in: query
      - schema:
          type: number
          minimum: 0
          default: 0
          description: Offset from the beginning of the list of objects. Can not be negative.
        required: false
        name: page[offset]
        in: query
      - schema:
          type: string
          enum:
          - Approved
          - Cancelled
          - Completed
          - Denied
          - Failed
          - NeedsApproval
          - Pending
          - Processing
          - Returned
          - Reversed
          - Sent
          description: Filter payouts by status.
          example: Sent
        required: false
        name: filter[status]
        in: query
      - schema:
          type: integer
          minimum: 0
          description: Only payouts of at least this amount, in cents.
          example: 1000
        required: false
        name: filter[minAmount]
        in: query
      - schema:
          type: integer
          minimum: 0
          description: Only payouts of at most this amount, in cents.
          example: 500000
        required: false
        name: filter[maxAmount]
        in: query
      - schema:
          type: string
          format: date-time
          description: Only payouts created at or after this ISO 8601 datetime.
          example: '2024-01-01T00:00:00.000Z'
        required: false
        name: filter[createdAfter]
        in: query
      - schema:
          type: string
          format: date-time
          description: Only payouts created at or before this ISO 8601 datetime.
          example: '2024-12-31T23:59:59.999Z'
        required: false
        name: filter[createdBefore]
        in: query
      - schema:
          type: string
          format: date
          description: Only payouts with an effective date on or after this date (YYYY-MM-DD).
          example: '2024-01-01'
        required: false
        name: filter[effectiveDateFrom]
        in: query
      - schema:
          type: string
          format: date
          description: Only payouts with an effective date on or before this date (YYYY-MM-DD).
          example: '2024-12-31'
        required: false
        name: filter[effectiveDateTo]
        in: query
      - schema:
          type: string
          format: uuid
          description: The unique identifier of the client making the request. This header is required to retrieve the client-specific configuration and ensure that the response is tailored to the client's settings and permissions.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: true
        name: Client-ID
        in: header
      - schema:
          type: string
          format: uuid
          description: Secure secret to access privileged endpoints.
          example: Bearer 633b336e4f57f095a405f6685e208cc7dd16de3e82494662f2acfeec3af1cdef
        required: true
        name: Authorization
        in: header
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ListCounterpartyPayoutsResponse'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
