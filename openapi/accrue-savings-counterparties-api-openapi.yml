      operationId: deleteCounterparty
      tags:
      - Counterparties
      summary: Delete Counterparty
      description: Soft-delete a counterparty. The counterparty will be marked as deleted but not permanently removed from the system. Deleting moves no money, so a counterparty that still holds a balance cannot be deleted — pay the remaining balance out first.
